<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>Agent Station</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --panel: #121a30;
    --panel-2: #18223d;
    --line: #26314f;
    --text: #e7ecf7;
    --muted: #8d9abb;
    --accent: #ffb547;
    --accent-ink: #1c1405;
    --ok: #4fd18b;
    --run: #5aa9ff;
    --bad: #ff6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    background-image: radial-gradient(circle at 20% 0%, #1a2550 0, transparent 45%),
      radial-gradient(1px 1px at 30px 40px, #ffffff33, transparent), radial-gradient(1px 1px at 120px 90px, #ffffff22, transparent);
    background-size: auto, 160px 160px, 160px 160px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0 14px; }
  .brand { font: 700 15px var(--mono); letter-spacing: .14em; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font: 12px var(--mono); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .budget { margin-bottom: 14px; }
  .budget-row { display: flex; justify-content: space-between; font: 13px var(--mono); color: var(--muted); }
  .budget-row b { color: var(--text); font-weight: 600; }
  .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  textarea, input {
    width: 100%; font: 16px/1.45 var(--sans); color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { min-height: 96px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .grow { flex: 1; }
  button {
    font: 600 15px var(--sans); border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin: 20px 0 10px; }
  .tab { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 8px 14px; min-height: 38px; font-size: 14px; }
  .tab.on { color: var(--text); border-color: var(--line); background: var(--panel); }
  .list { display: grid; gap: 8px; }
  .item { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--text); font-weight: 400; padding: 12px 14px; }
  .item:hover { border-color: var(--muted); }
  .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .item-task { margin-top: 6px; overflow-wrap: anywhere; }
  .meta { font: 12px var(--mono); color: var(--muted); }
  .pill { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
  .s-done { color: var(--ok); } .s-running, .s-queued { color: var(--run); } .s-failed, .s-interrupted { color: var(--bad); } .s-stopped { color: var(--muted); }
  .s-running::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .empty { color: var(--muted); text-align: center; padding: 28px 10px; }
  .detail h2 { font-size: 17px; margin: 14px 0 6px; overflow-wrap: anywhere; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px var(--mono); color: var(--muted); margin: 8px 0 4px; }
  .stats b { color: var(--text); font-weight: 600; }
  .steps { list-style: none; margin: 14px 0 0; padding: 0; border-left: 2px solid var(--line); }
  .steps li { position: relative; padding: 0 0 12px 16px; }
  .steps li::before { content: ""; position: absolute; left: -6px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel-2); border: 2px solid var(--muted); }
  .steps li.k-tool::before, .steps li.k-search::before { border-color: var(--accent); }
  .steps li.k-result::before { border-color: var(--ok); }
  .steps li.k-error::before { border-color: var(--bad); }
  .step-label { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .step-detail { font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: #c9d2e8; }
  .k-result .step-detail, .k-error .step-detail { font: 12px/1.45 var(--mono); max-height: 160px; overflow: auto; background: var(--panel-2); padding: 8px; border-radius: 8px; margin-top: 4px; }
  .result { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 14px; }
  .result a, .note a { color: var(--accent); }
  .result b.h, .note b.h { display: inline-block; font-size: 17px; margin-top: 4px; }
  .error { color: var(--bad); margin-top: 12px; }
  .note { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .login { max-width: 380px; margin: 18vh auto 0; }
  select { font: 16px var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
  #design-form input { margin-top: 10px; }
  .studio-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .filters { display: flex; gap: 6px; margin: 14px 0 10px; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; min-height: 34px; font-size: 13px; border-radius: 99px; }
  .chip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; justify-content: flex-start; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: left; color: var(--text); font-weight: 400; }
  .tile .img { aspect-ratio: 3 / 4; background: var(--panel-2); display: grid; place-items: center; color: var(--muted); font: 12px var(--mono); }
  .tile img, .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cap { padding: 8px 10px 10px; }
  .tile .t { font-size: 13px; line-height: 1.3; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .s-passed { color: var(--ok); } .s-rejected { color: var(--bad); } .s-generating, .s-judging, .s-revising { color: var(--run); }
  .s-generating::before, .s-judging::before, .s-revising::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; animation: blink 1s infinite; }
  .design-top { display: grid; gap: 16px; margin-top: 14px; }
  @media (min-width: 700px) { .design-top { grid-template-columns: 300px 1fr; } }
  .shot { aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .score { background: var(--panel-2); border-radius: 10px; padding: 8px; text-align: center; }
  .score b { display: block; font: 700 22px var(--mono); }
  .score span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .attempt { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .attempt ul { margin: 6px 0; padding-left: 18px; color: #c9d2e8; font-size: 14px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 6px; }
  details p { white-space: pre-wrap; font-size: 13px; color: #c9d2e8; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="login card hidden">
    <div class="brand">AGENT <span>STATION</span></div>
    <p class="hint">Enter your station password.</p>
    <form id="login-form">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <div class="row"><button class="grow" type="submit">Enter</button></div>
    </form>
  </section>

  <main id="app" class="hidden">
    <header>
      <div>
        <div class="brand">AGENT <span>STATION</span></div>
        <div class="sub" id="model">…</div>
      </div>
      <button class="ghost" id="logout" type="button">Lock</button>
    </header>

    <div class="card budget">
      <div class="budget-row"><span>Spent today</span><span><b id="spent">$0.00</b> / <span id="cap">$0.00</span></span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="hint" id="warn" style="margin-top:8px"></div>
    </div>

    <section id="home">
      <form id="task-form" class="card">
        <textarea id="task" placeholder="Give the agent a task, e.g. Find 5 trending print themes on Etsy this month that don't involve brands or characters, and save them to a note called trends."></textarea>
        <div class="row">
          <span class="hint grow" id="tools"></span>
          <button type="submit" id="send">Send</button>
        </div>
      </form>

      <div class="tabs">
        <button class="tab on" data-tab="jobs" type="button">Jobs</button>
        <button class="tab" data-tab="studio" type="button">Studio</button>
        <button class="tab" data-tab="notes" type="button">Notes</button>
      </div>
      <div id="jobs" class="list"></div>
      <div id="notes" class="list hidden"></div>
      <div id="studio" class="hidden">
        <form id="design-form" class="card">
          <div class="studio-head"><b>Make designs</b><span class="hint" id="studio-cost"></span></div>
          <div class="row">
            <label class="hint" for="count">How many</label>
            <select id="count"></select>
          </div>
          <input id="theme" placeholder="Theme (optional). Leave blank to use your trends note.">
          <div class="row">
            <span class="hint grow">Designer drafts → image model draws → judge scores → one redraw if needed</span>
            <button type="submit" id="make">Make</button>
          </div>
        </form>
        <div class="filters" id="filters">
          <button class="chip on" data-f="all" type="button">All</button>
          <button class="chip" data-f="passed" type="button">Passed</button>
          <button class="chip" data-f="rejected" type="button">Rejected</button>
        </div>
        <div id="gallery" class="gallery"></div>
      </div>
    </section>

    <section id="detail" class="detail hidden">
      <button class="ghost" id="back" type="button">← Back</button>
      <div id="detail-body"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let key = '';
  try { key = localStorage.getItem('station-key') || ''; } catch {}
  let openJob = null, openNote = null, tab = 'jobs', timer = null;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<)\]]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  // Light markdown for answers and notes: [text](url), bare links, **bold**, headings, bullet points.
  function md(s) {
    const links = [];
    let out = esc(s).replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, text, url) => {
      links.push(`<a href="${url}" target="_blank" rel="noopener">${text}</a>`);
      return `\u0000${links.length - 1}\u0000`;
    });
    out = out
      .replace(/https?:\/\/[^\s<)\]]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/^#{1,4} +(.+)$/gm, '<b class="h">$1</b>')
      .replace(/^[-*] +/gm, '• ');
    return out.replace(/\u0000(\d+)\u0000/g, (_, i) => links[i]);
  }
  const money = (n) => '$' + (n || 0).toFixed(n > 0 && n < 0.01 ? 4 : 2);
  const when = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 3500); };

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', 'x-station-key': key, ...(opts.headers || {}) } });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { lock(); throw new Error('Wrong password'); }
    if (!res.ok) throw new Error(data.error || 'Something went wrong');
    return data;
  }

  function lock() {
    key = ''; try { localStorage.removeItem('station-key'); } catch {}
    clearInterval(timer);
    $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pw').focus();
  }

  async function unlock() {
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    await refresh();
    clearInterval(timer);
    timer = setInterval(refresh, 2000);
  }

  async function refresh() {
    try {
      const [status, jobs] = await Promise.all([api('/api/status'), api('/api/jobs')]);
      renderStatus(status);
      setupStudio(status);
      if (openJob) await renderJob(openJob);
      else if (openDesign) await renderDesign(openDesign);
      else if (tab === 'jobs') renderJobs(jobs);
      else if (tab === 'studio') await renderDesigns();
    } catch (e) { if (e.message !== 'Wrong password') console.warn(e); }
  }

  function renderStatus(s) {
    $('model').textContent = s.model + (s.busy ? ' · working' : ' · idle') + (s.queued ? ` · ${s.queued} queued` : '');
    $('spent').textContent = money(s.spentToday);
    $('cap').textContent = money(s.dailyBudget);
    $('bar').style.width = Math.min(100, (s.spentToday / s.dailyBudget) * 100) + '%';
    $('tools').textContent = 'Tools: ' + s.tools.join(', ');
    $('warn').textContent = !s.hasApiKey ? 'No API key set on the server yet: add ANTHROPIC_API_KEY to .env.'
      : s.spentToday >= s.dailyBudget ? "Today's budget is used up. New jobs will stop straight away." : `Each job is capped at ${money(s.jobBudget)}.`;
  }

  function renderJobs(jobs) {
    $('jobs').innerHTML = jobs.length ? jobs.map((j) => `
      <button class="item" type="button" data-job="${j.id}">
        <div class="item-top"><span class="pill s-${j.status}">${j.status}</span><span class="meta">${when(j.createdAt)} · ${money(j.costUsd)}</span></div>
        <div class="item-task">${esc(j.task)}</div>
      </button>`).join('') : '<div class="empty">No jobs yet. Send your first task above.</div>';
  }

  async function renderJob(id) {
    const j = await api('/api/jobs/' + id);
    const active = j.status === 'running' || j.status === 'queued';
    const secs = j.startedAt ? Math.round((new Date(j.finishedAt || Date.now()) - new Date(j.startedAt)) / 1000) : 0;
    $('detail-body').innerHTML = `
      <div class="item-top" style="margin-top:14px"><span class="pill s-${j.status}">${j.status}</span>
        ${active ? '<button class="danger" id="stop" type="button">Stop</button>' : ''}</div>
      <h2>${esc(j.task)}</h2>
      <div class="stats"><span>Cost <b>${money(j.costUsd)}</b></span><span>Tokens <b>${(j.inputTokens + j.outputTokens).toLocaleString()}</b></span>
        <span>Searches <b>${j.searches}</b></span><span>Time <b>${secs}s</b></span><span>${esc(j.model)}</span></div>
      ${j.steps.length ? `<ul class="steps">${j.steps.map((s) => `<li class="k-${s.kind}"><div class="step-label">${esc(s.label)}</div><div class="step-detail">${linkify(s.detail)}</div></li>`).join('')}</ul>` : (active ? '<p class="hint">Waiting for the first step…</p>' : '')}
      ${j.result ? `<div class="card result">${md(j.result)}</div>` : ''}
      ${j.error ? `<div class="error">${esc(j.error)}</div>` : ''}`;
    const stop = $('stop');
    if (stop) stop.onclick = async () => { stop.disabled = true; try { await api(`/api/jobs/${id}/stop`, { method: 'POST' }); toast('Stopping…'); } catch (e) { toast(e.message); } };
  }

  async function renderNotes() {
    const notes = await api('/api/notes');
    $('notes').innerHTML = notes.length ? notes.map((n) => `
      <button class="item" type="button" data-note="${esc(n.name)}"><div class="item-top"><b>${esc(n.name)}</b><span class="meta">${when(n.updatedAt)}</span></div></button>`).join('')
      : '<div class="empty">No notes yet. Agents save notes here when a task asks them to.</div>';
  }

  async function showNote(name) {
    const n = await api('/api/notes/' + encodeURIComponent(name));
    openNote = name;
    $('home').classList.add('hidden'); $('detail').classList.remove('hidden');
    $('detail-body').innerHTML = `<h2>${esc(n.name)}</h2><div class="card note">${md(n.content)}</div>`;
  }

  function showJob(id) {
    openJob = id; openDesign = null;
    $('home').classList.add('hidden'); $('detail').classList.remove('hidden');
    $('detail-body').innerHTML = '<p class="hint">Loading…</p>';
    renderJob(id).catch((e) => toast(e.message));
    window.scrollTo(0, 0);
  }

  // ---------- Studio ----------
  let openDesign = null, filter = 'all', studioReady = false;
  const blobs = new Map(); // image path -> object URL (images need the password header, so fetch them)
  async function loadImg(el) {
    const src = el.dataset.src;
    if (!blobs.has(src)) {
      blobs.set(src, fetch(src, { headers: { 'x-station-key': key } })
        .then((r) => r.ok ? r.blob() : Promise.reject()).then((b) => URL.createObjectURL(b)).catch(() => { blobs.delete(src); return null; }));
    }
    const url = await blobs.get(src);
    if (url && el.isConnected) el.src = url;
  }
  const hydrate = (root) => root.querySelectorAll('img[data-src]').forEach(loadImg);
  const imgUrl = (id, n, v) => `/api/designs/${id}/image/${n}/${v}`;
  const avg = (v) => v ? Math.round((v.print_quality + v.sellability + v.originality) / 3 * 10) / 10 : null;

  function setupStudio(s) {
    if (studioReady || !s.studio) return;
    studioReady = true;
    const st = s.studio;
    $('count').innerHTML = Array.from({ length: st.maxDesigns }, (_, i) => `<option${i === 2 ? ' selected' : ''}>${i + 1}</option>`).join('');
    const per = st.imagePrice + 0.03;
    $('studio-cost').textContent = `≈ ${money(per)}–${money(per * (st.maxRevisions + 1))} per design · ${st.imageModel} ${st.imageSize}`;
  }

  async function renderDesigns() {
    const all = await api('/api/designs');
    const list = filter === 'all' ? all : all.filter((d) => d.status === filter);
    const g = $('gallery');
    const sig = filter + JSON.stringify(list);
    if (g.dataset.sig === sig) return;
    g.dataset.sig = sig;
    g.innerHTML = list.length ? list.map((d) => `
      <button class="tile" type="button" data-design="${d.id}">
        <div class="img">${d.image !== null ? `<img alt="" data-src="${imgUrl(d.id, d.image, 'thumb')}">` : (d.status === 'rejected' ? 'no image' : 'drawing…')}</div>
        <div class="cap"><span class="pill s-${d.status}">${d.status}</span>${d.verdict ? ` <span class="meta">${avg(d.verdict)}/10</span>` : ''}
          <div class="t">${esc(d.title)}</div></div>
      </button>`).join('') : `<div class="empty" style="grid-column:1/-1">${all.length ? 'Nothing here with that filter.' : 'No designs yet. Make your first batch above.'}</div>`;
    hydrate(g);
  }

  async function renderDesign(id) {
    const d = await api('/api/designs/' + id);
    const body = $('detail-body');
    const sig = JSON.stringify(d);
    if (body.dataset.sig === sig) return;
    body.dataset.sig = sig;
    const shownIdx = d.attempts.map((a, i) => (a.error ? -1 : i)).filter((i) => i >= 0).pop();
    const last = shownIdx !== undefined ? d.attempts[shownIdx] : null;
    const v = last?.verdict;
    $('detail-body').innerHTML = `
      <div class="design-top">
        <div class="shot">${last ? `<img alt="${esc(d.title)}" data-src="${imgUrl(d.id, shownIdx, 'preview')}">` : ''}</div>
        <div>
          <span class="pill s-${d.status}">${d.status}</span>
          <h2>${esc(d.title)}</h2>
          <div class="hint">${esc(d.theme)}</div>
          <p>${esc(d.why)}</p>
          ${d.reason ? `<div class="error">${esc(d.reason)}</div>` : ''}
          ${v ? `<div class="scores">
              <div class="score"><b>${v.print_quality}</b><span>Quality</span></div>
              <div class="score"><b>${v.sellability}</b><span>Sells</span></div>
              <div class="score"><b>${v.originality}</b><span>Original</span></div></div>
            <div class="stats"><span>IP risk <b>${esc(v.ip_risk)}</b></span><span>Text issues <b>${v.text_problems ? 'yes' : 'no'}</b></span>
              <span>Cost <b>${money(d.costUsd)}</b></span>${last.width ? `<span>${last.width}×${last.height}px</span>` : ''}</div>` : ''}
          <div class="actions">
            ${last ? `<button class="ghost" id="full" type="button">Open full size</button>` : ''}
            ${d.status === 'passed' ? `<button class="danger" id="bin" type="button">Bin it</button>` : ''}
          </div>
        </div>
      </div>
      ${d.attempts.map((a, i) => `
        <div class="attempt">
          <div class="step-label">Attempt ${i + 1}${a.outcome ? ` · judge said ${esc(a.outcome)}` : ''}</div>
          ${a.error ? `<div class="error">${esc(a.error)}</div>` : ''}
          ${a.verdict ? `<div class="step-detail">${esc(a.verdict.feedback)}</div>
            ${a.verdict.defects.length ? `<ul>${a.verdict.defects.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}` : ''}
          <details><summary>Prompt</summary><p>${esc(a.prompt)}</p></details>
        </div>`).join('')}`;
    hydrate($('detail-body'));
    const full = $('full');
    if (full) full.onclick = async () => {
      const w = window.open('', '_blank');
      const res = await fetch(imgUrl(d.id, shownIdx, 'full'), { headers: { 'x-station-key': key } });
      const url = URL.createObjectURL(await res.blob());
      if (w) w.location = url; else location.href = url;
    };
    const bin = $('bin');
    if (bin) bin.onclick = async () => { await api(`/api/designs/${d.id}/reject`, { method: 'POST' }); toast('Binned'); body.dataset.sig = ''; renderDesign(d.id); };
  }

  function showDesign(id) {
    openDesign = id;
    $('home').classList.add('hidden'); $('detail').classList.remove('hidden');
    $('detail-body').dataset.sig = '';
    $('detail-body').innerHTML = '<p class="hint">Loading…</p>';
    renderDesign(id).catch((e) => toast(e.message));
    window.scrollTo(0, 0);
  }

  $('gallery').onclick = (e) => { const b = e.target.closest('[data-design]'); if (b) showDesign(b.dataset.design); };
  $('filters').onclick = (e) => {
    const c = e.target.closest('[data-f]'); if (!c) return;
    filter = c.dataset.f;
    $('gallery').dataset.sig = '';
    document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c));
    renderDesigns().catch((er) => toast(er.message));
  };
  $('design-form').onsubmit = async (e) => {
    e.preventDefault();
    $('make').disabled = true;
    try {
      const job = await api('/api/designs/run', { method: 'POST', body: JSON.stringify({ count: $('count').value, theme: $('theme').value }) });
      $('theme').value = '';
      showJob(job.id);
    } catch (err) { toast(err.message); }
    finally { $('make').disabled = false; }
  };

  $('back').onclick = () => { openJob = null; openNote = null; openDesign = null; $('detail').classList.add('hidden'); $('home').classList.remove('hidden'); refresh(); if (tab === 'notes') renderNotes(); };
  $('jobs').onclick = (e) => { const b = e.target.closest('[data-job]'); if (b) showJob(b.dataset.job); };
  $('notes').onclick = (e) => { const b = e.target.closest('[data-note]'); if (b) showNote(b.dataset.note).catch((er) => toast(er.message)); };
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
    tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
    $('jobs').classList.toggle('hidden', tab !== 'jobs'); $('notes').classList.toggle('hidden', tab !== 'notes'); $('studio').classList.toggle('hidden', tab !== 'studio');
    if (tab === 'notes') renderNotes().catch((e) => toast(e.message)); else refresh();
  });

  $('task-form').onsubmit = async (e) => {
    e.preventDefault();
    const task = $('task').value.trim();
    if (!task) return;
    $('send').disabled = true;
    try {
      const job = await api('/api/jobs', { method: 'POST', body: JSON.stringify({ task }) });
      $('task').value = '';
      showJob(job.id);
    } catch (err) { toast(err.message); }
    finally { $('send').disabled = false; }
  };

  $('login-form').onsubmit = async (e) => {
    e.preventDefault();
    key = $('pw').value;
    try {
      await api('/api/status');
      try { localStorage.setItem('station-key', key); } catch {}
      $('pw').value = '';
      unlock();
    } catch { toast('Wrong password'); }
  };
  $('logout').onclick = lock;

  if (key) api('/api/status').then(unlock).catch(() => lock()); else lock();
})();
</script>
</body>
</html>
